[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiqc-pivot"
version = "0.1.0"
description = "A MultiQC plugin that folds related samples into one General Statistics row per group with labelled metric columns."
readme = "README.md"
authors = [{ name = "Clint Valentine", email = "valentine.clint@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "multiqc>=1.35,<2",
    "pydantic>=2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
"homepage" = "https://github.com/clintval/multiqc-pivot"
"repository" = "https://github.com/clintval/multiqc-pivot"
"Bug Tracker" = "https://github.com/clintval/multiqc-pivot/issues"

[project.entry-points."multiqc.hooks.v1"]
"execution_start" = "multiqc_pivot.plugin:execution_start"
"after_modules" = "multiqc_pivot.plugin:after_modules"

[tool.hatch.build.targets.wheel]
packages = ["multiqc_pivot"]

[dependency-groups]
dev = [
    "basedpyright ~=1.28",
    "ruff ==0.14.4",
    "mypy ==1.18.2",
    "pytest ~=8.4",
    "pytest-cov ~=6.2",
    "poethepoet ~=0.36",
]

[tool.poe.tasks]
fix-format = "ruff format"
fix-lint = "ruff check --fix"

fix-all.ignore_fail = "return_non_zero"
fix-all.sequence = [
    "fix-format",
    "fix-lint"
]

check-format = "ruff format --check --diff"
check-lint = "ruff check"
check-tests = "pytest"

_check-mypy = "mypy"
_check-pyright = "basedpyright"
check-typing.sequence = ["_check-mypy", "_check-pyright"]

check-all.ignore_fail = "return_non_zero"
check-all.sequence = [
    "check-format",
    "check-lint",
    "check-typing",
    "check-tests"
]

fix-and-check-all.ignore_fail = "return_non_zero"
fix-and-check-all.sequence = [
    "fix-format",
    "fix-lint",
    "check-typing",
    "check-tests"
]

[tool.mypy]
files = ["multiqc_pivot/", "tests/"]
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "exhaustive-match",
]

[tool.pyright]
include = ["multiqc_pivot/"]
failOnWarnings = false
reportAny = false
pythonVersion = "3.10"

[tool.pytest.ini_options]
minversion = "7.4"
addopts = [
    "--color=yes",
    "--cov-report=term-missing",
    "--cov=multiqc_pivot",
    "--import-mode=importlib",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
output-format = "full"
preview = true

[tool.ruff.lint]
select = [
    "A",      # Builtin shadowing
    "ARG",    # Unused arguments
    "C901",   # McCabe complexity
    "B",      # bugbear
    "D",      # pydocstyle (docstrings. We have the "google" convention enabled)
    "D204",   # Blank line between class docstring and first (__init__) method
    "D213",   # Summary line should be located on the line after opening quotes
    "E",      # pycodestyle errors
    "LOG",    # flake8-logging
    "LOG015", # (preview rule) Prohibit calls to the root logger
    "F",      # pyflakes
    "I",      # isort
    "N",      # PEP8 naming
    "W",      # pycodestyle warnings
    "Q",      # flake8-quotes
    "RUF008", # Do not use mutable default values for dataclass attributes
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
    "RUF024", # Do not pass mutable objects as values to dict.fromKeys
]
ignore = [
    "E203",
    "E701",
    "D212",  # summary line should be located on the same line as opening quotes
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]
unfixable = ["B"]
# NB: only preview rules explicitly selected above (e.g. LOG015) will be enforced
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Ignore `D103` Missing docstring in public function in test files
"tests/**.py" = ["D103"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.git-cliff.changelog]
header = ""
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
    {% endfor %}
{% endfor %}\n
"""

[tool.git-cliff.git]
conventional_commits = true
commit_parsers = [
    { message = "^.+!:*", group = "Breaking"},
    { message = "^security*", group = "Security"},
    { message = "^feat*", group = "Features"},
    { message = "^fix*", group = "Bug Fixes"},
    { message = "^docs*", group = "Documentation"},
    { message = "^perf*", group = "Performance"},
    { message = "^refactor*", group = "Refactor"},
    { message = "^style*", group = "Styling"},
    { message = "^test*", group = "Testing"},
    { message = "^chore\\(release\\):*", skip = true},
    { message = "^chore*", group = "Miscellaneous Tasks"},
    { body = ".*security", group = "Security"}
]
filter_commits = false
